<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b63b6">
<title>Derya Büro Çalışan Avantajları</title>
<style>
*{box-sizing:border-box}
html{background:#eef3f8}
body{margin:0;background:#eef3f8;color:#18344d;font-family:Inter,Arial,sans-serif}
button{font:inherit}
.app{width:100%;max-width:720px;margin:auto;background:#fff;min-height:100vh}
.hero{padding:22px 20px 24px;background:linear-gradient(145deg,#075aa7,#2685d0);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(8,77,140,.16)}
.brand{display:inline-flex;align-items:center;padding:9px 13px;background:#fff;color:#075aa7;border-radius:12px;font-weight:900;letter-spacing:.5px}
.hero h1{font-size:23px;line-height:1.18;margin:17px 0 6px}
.hero p{margin:0;font-size:13px;opacity:.9}
.sectors{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 14px;scrollbar-width:none}
.sectors::-webkit-scrollbar{display:none}
.sector{flex:0 0 auto;border:1px solid #d9e4ee;background:#fff;color:#3a5268;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer}
.sector.active{background:#e8f3fd;color:#075aa7;border-color:#b9d9f3;box-shadow:0 3px 9px rgba(7,90,167,.08)}
.content{padding:0 20px 28px}
.heading-row{display:flex;align-items:end;justify-content:space-between;margin:4px 0 13px}
.heading-row h2{font-size:19px;margin:0}
.count{font-size:11px;color:#7a8b9b}
.card{border:1px solid #e0e8ef;border-radius:20px;background:#fff;margin-bottom:13px;overflow:hidden;box-shadow:0 7px 20px rgba(24,52,77,.07);cursor:pointer;transition:.18s}
.card:active{transform:scale(.995)}
.card-head{display:flex;gap:14px;align-items:center;padding:15px}
.logo-wrap{width:76px;height:76px;flex:0 0 76px;border:1px solid #e4ebf1;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo{width:100%;height:100%;object-fit:contain;padding:5px}
.initial{font-size:24px;font-weight:900;color:#075aa7}
.info{min-width:0;flex:1}
.name{font-size:16px;font-weight:850;line-height:1.22}
.sector-name{font-size:11px;color:#7a8b9b;margin-top:4px}
.discount{display:inline-block;margin-top:8px;padding:7px 10px;border-radius:10px;background:#eaf5ff;color:#075aa7;font-size:13px;font-weight:900}
.chevron{font-size:20px;color:#8da0b0;transition:.2s}
.card.open .chevron{transform:rotate(90deg)}
.detail{display:none;border-top:1px solid #e6edf2;padding:15px;background:#fbfdff}
.card.open .detail{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.detail-box{background:#fff;border:1px solid #e4ebf1;border-radius:13px;padding:10px}
.detail-box small{display:block;color:#8091a0;font-size:10px;margin-bottom:4px;font-weight:700;text-transform:uppercase}
.detail-box div{font-size:12px;line-height:1.45}
.detail-section{margin-top:11px}
.detail-section h3{font-size:12px;margin:0 0 5px;color:#24445f}
.detail-section p{font-size:12px;line-height:1.55;margin:0;white-space:pre-line;color:#3b5368}
.empty{padding:30px 15px;text-align:center;color:#7c8c9b}
footer{text-align:center;color:#91a0ad;font-size:10px;padding:0 20px 24px}
@media(max-width:430px){.hero h1{font-size:21px}.content,.sectors{padding-left:15px;padding-right:15px}.detail-grid{grid-template-columns:1fr}.logo-wrap{width:68px;height:68px;flex-basis:68px}}
.hero {
  position: relative;
}
.hero {
  position: relative;
}

.hero h1 {
  text-align: center;
  margin-top: 20px;
}

.hero > p {
  text-align: center;
}

.yayin-bilgisi {
  position: absolute;
  top: 20px;
  right: 24px;
  text-align: right;
  color: rgba(255,255,255,.95);
  font-size: 12px;
  line-height: 1.4;
}

.yayin-bilgisi div {
  margin-bottom: 6px;
}

.yayin-bilgisi strong {
  font-weight: 700;
}

@media (max-width: 600px) {
  .yayin-bilgisi {
    top: 18px;
    right: 14px;
    font-size: 10px;
  }

  .hero h1 {
    margin-top: 25px;
  }
}
</style>
</head>

const SECTORS = ["Tümü", "Alışveriş", "Eğitim", "Sağlık", "Ulaşım", "Yeme & İçme"];
let selected = "Tümü";

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function logoFor(item){
  return item.logo ? "logos/" + item.logo : "";
}

function render(){
  const sectorBox=document.getElementById("sectors");
  sectorBox.innerHTML=SECTORS.map(s =>
    `<button type="button" class="sector ${s===selected?'active':''}" data-sector="${esc(s)}">${esc(s)}</button>`
  ).join("");

  sectorBox.querySelectorAll(".sector").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selected=btn.dataset.sector;
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
  });

  const list=DATA.filter(x=>selected==="Tümü" || x.sector===selected);
  document.getElementById("heading").textContent=selected==="Tümü"?"Tüm Kampanyalar":selected;
  document.getElementById("count").textContent=list.length+" kampanya";

  const cards=document.getElementById("cards");
  if(!list.length){
    cards.innerHTML='<div class="empty">Bu sektörde henüz kampanya bulunmuyor.</div>';
    return;
  }

  cards.innerHTML=list.map((x,i)=>{
    const img=logoFor(x);
    const logo=img
      ? `<img class="logo" src="${img}" alt="">`
      : `<span class="initial">${esc(x.name.slice(0,1))}</span>`;
    return `<article class="card" data-index="${i}">
      <div class="card-head">
        <div class="logo-wrap">${logo}</div>
        <div class="info">
          <div class="name">${esc(x.name)}</div>
          <div class="sector-name">${esc(x.sector)}</div>
          <div class="discount">${esc(x.discount)}</div>
        </div>
        <div class="chevron">›</div>
      </div>
      <div class="detail">
        <div class="detail-grid">
          <div class="detail-box"><small>Geçerlilik</small><div>${esc(x.start)} – ${esc(x.end)}</div></div>
          <div class="detail-box"><small>Adres</small><div>${esc(x.address)}</div></div>
        </div>
        ${x.eligible?`<div class="detail-section"><h3>Kimler yararlanabilir?</h3><p>${esc(x.eligible)}</p></div>`:""}
        <div class="detail-section"><h3>Kullanım şartları</h3><p>${esc(x.conditions)}</p></div>
        <div class="detail-section"><h3>İndirim detayları</h3><p>${esc(x.details)}</p></div>
      </div>
    </article>`;
  }).join("");

  cards.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",()=>{
      card.classList.toggle("open");
    });
  });
}
render();
</script>
</body>
</html>
